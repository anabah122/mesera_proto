services:
  mesera:
    build: .
    ports:
      - "8100:8100"
    volumes:
      # Журналы и пользователи переживают пересборку образа.
      - mesera-data:/data
    environment:
      MESERA_DB: /data/mesera.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mesera-data:
