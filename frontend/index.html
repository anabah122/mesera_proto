<!-- Страница входа. Только авторизация по HTTP: ни сокета, ни IndexedDB. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mesera — вход</title>
<link rel="stylesheet" href="style.css?v=8">

<div id="gate" class="gate">
  <form id="auth" class="auth">
    <h1>mesera</h1>
    <div class="tabs">
      <button type="button" class="tab active" data-mode="login">Вход</button>
      <button type="button" class="tab" data-mode="register">Регистрация</button>
    </div>
    <input id="login" placeholder="Логин" autocomplete="username" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <input id="name" placeholder="Имя в системе" autocomplete="nickname" hidden>
    <p id="authError" class="error" hidden></p>
    <button class="primary" type="submit">Войти</button>
  </form>
</div>

<script type="module" src="auth.js?v=8"></script>
